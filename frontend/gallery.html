<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>RaspiVision — Gallery</title>
</head>
<body class="bg-black min-h-screen flex flex-col">

<header class="bg-zinc-950 border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
        <span class="text-white font-mono text-sm tracking-wider">CAM-RASPI</span>
        <nav class="flex items-center gap-1">
            <a href="/" class="text-zinc-500 hover:text-zinc-300 font-mono text-xs px-3 py-1 rounded transition-colors">LIVE</a>
            <a href="/gallery.html"
               class="text-white font-mono text-xs px-3 py-1 rounded bg-zinc-800 border border-zinc-700">GALLERY</a>
        </nav>
    </div>
    <span class="text-zinc-500 font-mono text-xs">RASPI-VISION</span>
</header>

<main class="flex-1 p-4 max-w-7xl mx-auto w-full">
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <span class="text-white font-mono text-sm tracking-wider">RECORDINGS</span>
            <span id="videoCount" class="text-zinc-500 font-mono text-xs"></span>
        </div>
        <button id="btnRefresh"
                class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white px-4 py-2 rounded font-mono text-xs cursor-pointer transition-colors flex items-center gap-2">
            <i data-feather="refresh-cw" class="w-3 h-3"></i> REFRESH
        </button>
    </div>

    <div id="loading" class="flex items-center justify-center py-24 text-zinc-600 font-mono text-sm">
        LOADING<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>

    <div id="empty" class="hidden flex items-center justify-center py-24 text-zinc-600 font-mono text-sm">
        NO RECORDINGS FOUND
    </div>

    <div id="grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    </div>
</main>

<script src="js/gallery.js"></script>
</body>
</html>
